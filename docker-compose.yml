# Локальная PostgreSQL для разработки. Значения берутся из .env (см. .env.example).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: ${DB_USER:?задайте DB_USER в .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env}
    ports:
      - "127.0.0.1:5432:5432"   # доступ только с локальной машины
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
